name: Daily heartbeat

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Append heartbeat
        run: |
          DATE=$(date -u '+%Y-%m-%d')
          mkdir -p .github
          echo "${DATE}" >> .github/heartbeat.log

      - name: Commit and push changes
        run: |
          DATE=$(date -u '+%Y-%m-%d')
          git config user.name "Progress-infinitely"
          git config user.email "102594894+Progress-infinitely@users.noreply.github.com"
          git add .github/heartbeat.log
          git commit -m "chore: heartbeat ${DATE}"
          git push origin main
